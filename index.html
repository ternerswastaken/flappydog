<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Small paws. Big dreams. Play Flappy Dog and flap through the hedges in light or dark mode.">
<title>Flappy Dog — Fetch the sky</title>
<script src="theme.js"></script>
<style>
:root{color-scheme:light;--page:#f5f0e6;--text:#27382e;--muted:#526658;--footer:#626e5e;--accent:#a94f24;--frame:#fffaf0;--sky:#cbe6df;--badge:#fffaf0f2;--veil:#cbe6df18;--eyebrow:#496650;--button:#a94f24;--button-hover:#913e1b;--button-edge:#77361a;--button-text:#fffaf0;--key:#fffaf0;--border:#ccc7ba;--shadow:#384b3020;--focus:#27382e}
:root[data-theme="dark"]{color-scheme:dark;--page:#101b20;--text:#edf4eb;--muted:#c1d0c7;--footer:#afbeb5;--accent:#f3a873;--frame:#293e42;--sky:#172e3d;--badge:#1b3037f2;--veil:#10212a66;--eyebrow:#b6d5bc;--button:#f1a16b;--button-hover:#ffb681;--button-edge:#b66f43;--button-text:#241b15;--key:#23363c;--border:#516b70;--shadow:#00000055;--focus:#f9cd8b}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,1060px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:900;font-size:22px;letter-spacing:-1px;white-space:nowrap}.brand span{color:var(--accent)}small{font-size:11px;font-weight:bold;letter-spacing:2px}.controls{display:flex;align-items:center;gap:12px}.shell{position:relative;overflow:hidden;border:6px solid var(--frame);border-radius:24px;box-shadow:0 16px 45px var(--shadow);background:var(--sky)}canvas{width:100%;display:block;aspect-ratio:960/560;touch-action:none}.hud{position:absolute;top:23px;left:26px;right:26px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:var(--badge);border-radius:12px;padding:10px 17px;font-size:11px;font-weight:800;letter-spacing:1px}.badge strong{font-size:23px;display:block;margin-top:3px;letter-spacing:0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--veil)}.card{padding:24px;max-width:500px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--eyebrow)}h1{font-size:clamp(36px,6vw,70px);letter-spacing:-3px;line-height:.98;margin:15px 0}p{line-height:1.6;color:var(--muted)}button{background:var(--button);color:var(--button-text);border:0;border-bottom:4px solid var(--button-edge);border-radius:12px;padding:16px 30px;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:var(--button-hover)}button:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.hidden{display:none}footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;color:var(--footer);font-size:12px}kbd{font:inherit;background:var(--key);border:1px solid var(--border);border-radius:5px;padding:4px 7px}#sound,#theme{background:transparent;color:var(--muted);padding:10px 8px;border:0;font-size:12px;min-height:44px;white-space:nowrap}#theme{border:1px solid var(--border);background:var(--key)}#theme:hover,#sound:hover{color:var(--text)}@media(max-width:850px){header small{display:none}}@media(max-width:600px){body{padding:12px}header{gap:6px}.brand{font-size:20px}.controls{gap:4px}#sound,#theme{padding:10px 6px}canvas{aspect-ratio:3/4}.hud{top:12px;left:12px;right:12px}.badge{padding:7px 12px}footer{font-size:10px}.card{padding-top:70px}h1{letter-spacing:-2px}}@media(max-width:360px){header{flex-wrap:wrap}.controls{margin-left:auto}footer{flex-direction:column;gap:12px}}
</style>
</head>
<body>
<main><header><div class="brand">flappy<span>dog.</span> 🐾</div><small>A LITTLE DOG. A BIG SKY.</small><div class="controls"><button id="theme" type="button" aria-label="Dark mode" aria-pressed="false">Dark mode: off</button><button id="sound" type="button" aria-pressed="false">Sound: off</button></div></header>
<div class="shell"><canvas id="game" width="960" height="560" aria-label="Flappy Dog game: press Space, click, or tap to flap past the hedges"></canvas><div class="hud"><div class="badge">SCORE<strong id="score">0</strong></div><div class="badge">PERSONAL BEST<strong id="best">0</strong></div></div><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY, SET, WOOF.</div><h1 id="title">Fetch the sky.</h1><p id="message">Small paws. Unreasonably big dreams.<br>Flap through the hedges and keep the adventure going.</p><button id="start">Let’s fly ↗</button><p style="font-size:11px">SPACE / CLICK / TAP TO FLAP</p></div></div></div>
<footer><span><kbd>Space</kbd> to flap · <kbd>P</kbd> to pause</span><span>Made for good dogs with lofty ambitions.</span></footer></main>
<script src="game.js"></script>
</body></html>
