<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flappy Dog — Fetch the sky</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#27382e;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,1060px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;font-size:22px;letter-spacing:-1px}.brand span{color:#d36c36}small{font-size:11px;font-weight:bold;letter-spacing:2px}.shell{position:relative;overflow:hidden;border:6px solid #fffaf0;border-radius:24px;box-shadow:0 16px 45px #384b3020;background:#cbe6df}canvas{width:100%;display:block;aspect-ratio:960/560;touch-action:none}.hud{position:absolute;top:23px;left:26px;right:26px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#fffaf0e8;border-radius:12px;padding:10px 17px;font-size:11px;font-weight:800;letter-spacing:1px}.badge strong{font-size:23px;display:block;margin-top:3px;letter-spacing:0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#cbe6df18}.card{padding:24px;max-width:500px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:#597a64}h1{font-size:clamp(36px,6vw,70px);letter-spacing:-3px;line-height:.98;margin:15px 0}p{line-height:1.6;color:#526658}button{background:#e98447;color:#fffaf0;border:0;border-bottom:4px solid #bc5e30;border-radius:12px;padding:16px 30px;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#d97339}button:focus-visible{outline:3px solid #27382e;outline-offset:4px}.hidden{display:none}footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;color:#748070;font-size:12px}kbd{font:inherit;background:#fffaf0;border:1px solid #ddd9ce;border-radius:5px;padding:4px 7px}#sound{background:transparent;color:#526658;padding:4px;border:0;font-size:12px}@media(max-width:600px){body{padding:12px}header small{display:none}canvas{aspect-ratio:3/4}.hud{top:12px;left:12px;right:12px}.badge{padding:7px 12px}footer{font-size:10px}.card{padding-top:70px}h1{letter-spacing:-2px}}
</style>
</head>
<body>
<main><header><div class="brand">flappy<span>dog.</span> 🐾</div><small>A LITTLE DOG. A BIG SKY.</small><button id="sound" aria-pressed="false">Sound: off</button></header>
<div class="shell"><canvas id="game" width="960" height="560" aria-label="Flappy Dog game: press Space, click, or tap to flap past the hedges"></canvas><div class="hud"><div class="badge">SCORE<strong id="score">0</strong></div><div class="badge">PERSONAL BEST<strong id="best">0</strong></div></div><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY, SET, WOOF.</div><h1 id="title">Fetch the sky.</h1><p id="message">Small paws. Unreasonably big dreams.<br>Flap through the hedges and keep the adventure going.</p><button id="start">Let’s fly ↗</button><p style="font-size:11px">SPACE / CLICK / TAP TO FLAP</p></div></div></div>
<footer><span><kbd>Space</kbd> to flap · <kbd>P</kbd> to pause</span><span>Made for good dogs with lofty ambitions.</span></footer></main>
<script src="game.js"></script>
</body></html>
